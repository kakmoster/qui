name: Build and Publish Custom Unraid Image

on:
  push:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test-go:
    name: Run Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create placeholder web dist for embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go crossseed and handler tests
        run: go test -v ./internal/services/crossseed/... ./internal/api/handlers/...

  test-web:
    name: Test and lint frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: pnpm run lint

      - name: Run frontend tests
        working-directory: web
        run: pnpm exec vitest run src/hooks/useCrossSeedWarning.test.ts src/components/torrents/DeleteTorrentDialog.test.tsx src/components/torrents/bulk-actions/__tests__/bulk-action-state.test.ts src/components/torrents/bulk-actions/__tests__/BulkActionProvider.test.tsx src/components/torrents/table/__tests__/TorrentTableOptimized.smoke.test.tsx src/i18n/plurals.test.ts

      - name: Build frontend
        working-directory: web
        run: CI= pnpm run build

  docker:
    name: Build and push Docker image to GHCR
    needs: [test-go, test-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
